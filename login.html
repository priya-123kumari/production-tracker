<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PARTH OVERSEAS - Login</title>

    <link rel="stylesheet"
          href="css/style.css">

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            background: #f4f6f8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 35px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 8px;
            color: #526970;
            font-size: 26px;
            font-weight: 700;
        }

        .login-title {
            text-align: center;
            margin-bottom: 8px;
            color: #263238;
            font-size: 24px;
        }

        .login-subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #263238;
            font-size: 14px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 15px;
        }

        .form-control:focus {
            outline: none;
            border-color: #526970;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #526970;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .forgot-password {
            display: block;
            text-align: right;
            margin-top: 10px;
            color: #526970;
            font-size: 13px;
            text-decoration: none;
        }

        .login-note {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #6b7280;
        }

        @media (max-width: 500px) {

            .login-container {
                padding: 15px;
            }

            .login-card {
                padding: 25px 20px;
            }

        }

    </style>

</head>


<body>


<div class="login-container">

    <div class="login-card">

        <div class="login-logo">
            PARTH OVERSEAS
        </div>

        <h1 class="login-title">
            Production Tracking
        </h1>

        <p class="login-subtitle">
            Sign in to continue
        </p>


        <!-- ROLE -->

        <div class="form-group">

            <label class="form-label">
                Login As
            </label>

            <select
                id="role"
                class="form-control">

                <option value="">
                    Select Role
                </option>

                <option value="admin">
                    Admin
                </option>

                <option value="supervisor">
                    Supervisor
                </option>

            </select>

        </div>


        <!-- USERNAME -->

        <div class="form-group">

            <label
                class="form-label"
                for="username">

                Username

            </label>

            <input
                type="text"
                id="username"
                class="form-control"
                placeholder="Enter username">

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label
                class="form-label"
                for="password">

                Password

            </label>

            <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Enter password">

        </div>


        <a href="#"
           class="forgot-password">

            Forgot Password?

        </a>


        <br>


        <button
            type="button"
            class="login-btn"
            onclick="loginUser()">

            LOGIN

        </button>


        <div class="login-note">

            Production Tracking System

        </div>

    </div>

</div>


<script>

function loginUser() {

    const role = document.getElementById("role").value;

    const username = document
        .getElementById("username")
        .value
        .trim();

    const password = document
        .getElementById("password")
        .value
        .trim();


    if (role === "") {

        alert("Please select your role.");

        return;

    }


    if (username === "") {

        alert("Please enter username.");

        return;

    }


    if (password === "") {

        alert("Please enter password.");

        return;

    }


    // Save login information in browser
    localStorage.setItem("username", username);
    localStorage.setItem("role", role);


    // Redirect according to selected role

    if (role === "admin") {

        window.location.href =
            "pages/admin-dashboard.html";

    }


    if (role === "supervisor") {

        window.location.href =
            "index.html";

    }

}

</script>


</body>

</html>
